---
# PVC pour Mimir
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mimir-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
# ConfigMap pour Mimir
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: monitoring
data:
  mimir.yaml: |
    # Mode monolithique : tous les rôles dans un seul processus
    target: all

    # Multi-tenancy désactivé
    multitenancy_enabled: false

    # Stockage filesystem
    blocks_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/blocks
      tsdb:
        dir: /data/mimir/tsdb
      bucket_store:
        sync_dir: /data/mimir/tsdb-sync

    # Compactor
    compactor:
      data_dir: /data/mimir/compactor
      sharding_ring:
        kvstore:
          store: inmemory

    # Limites (noms de champs Mimir : ingestion_rate en samples/s, burst en samples)
    limits:
      ingestion_rate: 100000
      ingestion_burst_size: 200000

    # Serveur
    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
      log_level: info

    # Alertmanager (storage filesystem — requis si activé)
    alertmanager:
      data_dir: /data/mimir/alertmanager
      enable_api: true
    alertmanager_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/alertmanager-store

    # Ruler (storage filesystem — requis sinon le ruler échoue)
    ruler:
      rule_path: /data/mimir/rules
    ruler_storage:
      backend: filesystem
      filesystem:
        dir: /data/mimir/ruler-store

    # Anneau (ring) pour le mode monolithique
    ingester:
      ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    distributor:
      ring:
        kvstore:
          store: inmemory

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: inmemory

    # Usage stats / télémétrie (désactivé pour la confidentialité)
    usage_stats:
      enabled: false
---
# Déploiement Mimir
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app: mimir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mimir
  template:
    metadata:
      labels:
        app: mimir
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:3.2.1
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
          ports:
            - name: http
              containerPort: 9009
              protocol: TCP
            - name: grpc
              containerPort: 9095
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: data
              mountPath: /data/mimir
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 9009
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: mimir-config
        - name: data
          persistentVolumeClaim:
            claimName: mimir-data
---
# Service Mimir
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: monitoring
  labels:
    app: mimir
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9009
      targetPort: 9009
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
  selector:
    app: mimir
---
# Service pour l'API Prometheus-compatible
apiVersion: v1
kind: Service
metadata:
  name: mimir-prometheus
  namespace: monitoring
  labels:
    app: mimir
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9009
      targetPort: 9009
      protocol: TCP
  selector:
    app: mimir