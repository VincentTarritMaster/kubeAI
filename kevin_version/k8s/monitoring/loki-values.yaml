# Mode SingleBinary : tout dans un seul pod, stockage filesystem local
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

# Désactiver les composants distribués
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Ressources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Persistence
persistence:
  enabled: true
  size: 5Gi
  storageClassName: standard

# Service
service:
  type: ClusterIP
  port: 3100