apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui-edge
  namespace: kubeai
  labels:
    app: webui-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui-edge
  template:
    metadata:
      labels:
        app: webui-edge
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: webui-edge.conf
              readOnly: true
            - name: ui-js
              mountPath: /usr/share/nginx/html/kubeai-ui.js
              subPath: kubeai-ui.js
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: webui-edge-config
        - name: ui-js
          configMap:
            name: webui-edge-config
---
apiVersion: v1
kind: Service
metadata:
  name: webui-edge
  namespace: kubeai
spec:
  selector:
    app: webui-edge
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
