apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: collecte
resources:
  - namespace.yaml
  - ../../../monitoring/rbac.yaml
  - ../../../monitoring/rbac-cadvisor.yaml
  - ../../../monitoring/rbac-kubeai.yaml
  - ../../../monitoring/alloy.yaml
  - ../../../monitoring/kube-state-metrics.yaml
configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy=config.alloy
    options:
      disableNameSuffixHash: true
  - name: kubeai-collector-targets
    literals:
      - OBSERVED_CLUSTER=kubeai-observed
      - MIMIR_WRITE_URL=https://CHANGE_ME_SUPERVISION_PRIVATE_IP:30009/api/v1/push
      - LOKI_WRITE_URL=https://CHANGE_ME_SUPERVISION_PRIVATE_IP:30310/loki/api/v1/push
    options:
      disableNameSuffixHash: true
patches:
  - target:
      kind: PersistentVolumeClaim
      name: alloy-data
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: alloy-data
      spec:
        storageClassName: exoscale-sbs
  - target:
      kind: Deployment
      name: alloy
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: alloy
      spec:
        template:
          spec:
            volumes:
              - name: mtls
                secret:
                  secretName: kubeai-alloy-mtls-client
                  defaultMode: 0440
            containers:
              - name: alloy
                envFrom:
                  - configMapRef:
                      name: kubeai-collector-targets
                volumeMounts:
                  - name: mtls
                    mountPath: /etc/alloy/mtls
                    readOnly: true
  - target:
      kind: ClusterRoleBinding
      name: kubeai-alloy-pod-logs
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: kubeai-alloy-pod-logs
      subjects:
        - kind: ServiceAccount
          name: alloy
          namespace: collecte
  - target:
      kind: ClusterRoleBinding
      name: kubeai-alloy-cadvisor
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: kubeai-alloy-cadvisor
      subjects:
        - kind: ServiceAccount
          name: alloy
          namespace: collecte
  - target:
      kind: ClusterRoleBinding
      name: kubeai-monitoring-kube-state-metrics
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: kubeai-monitoring-kube-state-metrics
      subjects:
        - kind: ServiceAccount
          name: kube-state-metrics
          namespace: collecte
