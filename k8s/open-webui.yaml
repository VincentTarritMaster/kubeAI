apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: kubeai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      automountServiceAccountToken: false
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.4-slim
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          env:
            - name: WEBUI_AUTH
              value: "True"
            - name: ENABLE_SIGNUP
              value: "True"
            - name: DEFAULT_USER_ROLE
              value: pending
            - name: ENABLE_OPENAI_API
              value: "True"
            - name: ENABLE_OLLAMA_API
              value: "False"
            - name: OPENAI_API_BASE_URL
              value: http://kubeai-agent.kubeai.svc.cluster.local:8000/v1
            - name: OPENAI_API_KEY
              value: kubeai-local
            - name: DEFAULT_MODELS
              value: kubeai
            - name: ENABLE_PERSISTENT_CONFIG
              value: "True"
            - name: DEFAULT_LOCALE
              value: fr-FR
            - name: ENABLE_TITLE_GENERATION
              value: "False"
            - name: ENABLE_TAGS_GENERATION
              value: "False"
            - name: ENABLE_FOLLOW_UP_GENERATION
              value: "False"
            - name: DEFAULT_PROMPT_SUGGESTIONS
              value: '[{"title":["Santé du namespace","Pods et ressources"],"content":"Quel est l’état actuel du namespace kubeai ? Appuie ta réponse sur les métriques disponibles."},{"title":["Analyser un incident","Erreurs et logs récents"],"content":"Quels pods ont actuellement un problème ? Vérifie leur état, les redémarrages et les logs récents."}]'
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: kubeai
spec:
  selector:
    app: open-webui
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
