apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: kubeai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.4-slim
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          env:
            - name: WEBUI_AUTH
              value: "False"
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: kubeai
spec:
  selector:
    app: open-webui
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
