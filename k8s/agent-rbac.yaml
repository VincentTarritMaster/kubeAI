apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeai-agent
  namespace: kubeai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeai-agent
rules:
  - apiGroups: [""]
    resources: [nodes, pods, events]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeai-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeai-agent
subjects:
  - kind: ServiceAccount
    name: kubeai-agent
    namespace: kubeai
