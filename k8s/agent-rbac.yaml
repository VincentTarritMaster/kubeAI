apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeai-agent
  namespace: kubeai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeai-agent
  namespace: kubeai
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeai-agent
  namespace: kubeai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeai-agent
subjects:
  - kind: ServiceAccount
    name: kubeai-agent
    namespace: kubeai
