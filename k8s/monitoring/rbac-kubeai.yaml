apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeai-alloy-pod-logs
  namespace: kubeai
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeai-alloy-pod-logs
  namespace: kubeai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeai-alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
