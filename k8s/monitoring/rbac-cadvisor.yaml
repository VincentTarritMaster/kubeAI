apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeai-alloy-cadvisor
rules:
  # Découverte des nœuds pour construire l'URL du proxy cAdvisor.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list, watch]
  # Lecture seule du proxy kubelet ; nécessaire pour /metrics/cadvisor.
  - apiGroups: [""]
    resources: [nodes/proxy]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeai-alloy-cadvisor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeai-alloy-cadvisor
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring
