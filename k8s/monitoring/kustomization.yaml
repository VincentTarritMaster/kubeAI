apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - rbac.yaml
  - prometheus.yaml
  - loki.yaml
  - alloy.yaml
  - kube-state-metrics.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=config/prometheus.yml
  - name: loki-config
    files:
      - loki.yml=config/loki.yml
  - name: alloy-config
    files:
      - config.alloy=config/config.alloy
